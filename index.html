<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3e4ea">
<meta name="description" content="A little game, from Khalil.">
<title>For Alaa</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 22'%3E%3Cpath fill='%23d6648c' d='M12 21C2 14-1 8 2 4 5 0 10 1 12 5 14 1 19 0 22 4 25 8 22 14 12 21Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&display=swap">
<style>
:root{--bg1:#f8eee9;--bg2:#ecdbe6;--ink:#3b2a45;--glass:rgba(255,249,245,.92);--rose:#d6648c;--sw:min(92vw,calc((100dvh - 150px)*.6923));--fs:22px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#181321;--bg2:#2a1f3d;--ink:#f7eaf1;--glass:rgba(28,20,40,.9)}}
:root[data-theme="dark"]{--bg1:#181321;--bg2:#2a1f3d;--ink:#f7eaf1;--glass:rgba(28,20,40,.9)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(var(--bg1),var(--bg2));color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;left:0;right:0;top:0;height:100%;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--sw)*.02);padding:max(env(safe-area-inset-top),6px) max(env(safe-area-inset-right),6px) max(env(safe-area-inset-bottom),6px) max(env(safe-area-inset-left),6px)}
#hd{display:flex;gap:calc(var(--sw)*.022);height:calc(var(--sw)*.05);align-items:center;justify-content:center;flex:none}
#hd svg{height:100%;width:auto;aspect-ratio:24/22;transition:opacity .5s}
.stage{position:relative;flex:none;width:var(--sw);aspect-ratio:360/520;border-radius:calc(var(--sw)*.07);overflow:hidden;isolation:isolate;transform:translateZ(0);box-shadow:0 18px 50px rgba(60,30,80,.3);touch-action:none;background:#e9d8e6}
#world{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
#world>svg,#world>canvas,#ht,#vg,#sp{position:absolute;inset:0;width:100%;height:100%}
#fg,#ht,#vg,#sp{pointer-events:none}
#cv{touch-action:none}
#vg{opacity:0;transition:opacity 1.4s;background:radial-gradient(ellipse at 50% 44%,transparent 38%,rgba(52,22,78,.5) 100%)}
#vg.on,#sp.on{opacity:1}
#sp{opacity:0;transition:opacity 1.4s}
#sp i{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff 0,rgba(255,226,240,.7) 35%,transparent 70%);animation:tw var(--t) ease-in-out var(--d) infinite alternate}
#ht svg{position:absolute;bottom:-30px;opacity:0;animation:rise var(--t) linear var(--d) infinite}
#bu{position:absolute;transform:translate(-50%,-100%);width:max-content;max-width:62%;padding:.38em .75em;border-radius:.8em;background:#fffaf5;color:#3b2a45;font:italic 600 calc(var(--sw)*.054)/1.15 "Cormorant Garamond",Georgia,serif;text-align:center;box-shadow:0 6px 18px rgba(60,30,80,.22);opacity:0;transition:opacity .3s;pointer-events:none}
#bu.on{opacity:1}
#bu:after{content:"";position:absolute;left:50%;bottom:-.3em;width:.6em;height:.6em;background:#fffaf5;transform:translateX(-50%) rotate(45deg);border-radius:2px}
#tb{position:absolute;left:4.5%;right:4.5%;bottom:3.5%;min-height:24%;padding:calc(var(--sw)*.07) calc(var(--sw)*.05) calc(var(--sw)*.05);display:flex;flex-direction:column;justify-content:center;border-radius:calc(var(--sw)*.055);background:#fffaf5;color:#3b2a45;border:1.5px solid rgba(214,100,140,.55);box-shadow:0 10px 30px rgba(60,30,80,.3);opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .35s,transform .35s,visibility .35s}
#tb.on{opacity:1;visibility:visible;transform:none}
#tn{position:absolute;top:calc(var(--sw)*-.04);left:calc(var(--sw)*.05);padding:.05em .85em .1em;border-radius:99px;font:italic 700 calc(var(--sw)*.05)/1.25 "Cormorant Garamond",Georgia,serif;color:#fff;background:#6f98e0;box-shadow:0 3px 10px rgba(60,30,80,.2)}
#tn.k{background:#d6648c}
#tx{margin:0;font:italic 600 calc(var(--sw)*.064)/1.2 "Cormorant Garamond",Georgia,serif;text-align:center;min-height:2.4em;display:flex;align-items:center;justify-content:center}
#tx.sm{font-size:calc(var(--sw)*.055)}
#tk{position:absolute;right:calc(var(--sw)*.045);bottom:calc(var(--sw)*.012);font-style:normal;font-size:calc(var(--sw)*.05);color:#d6648c;opacity:0;transition:opacity .25s;animation:bob .8s ease-in-out infinite alternate}
#tb.w #tk{opacity:1}
#pn{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--sw)*.04);padding:calc(var(--sw)*.07);text-align:center;background:var(--glass);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
#pn.on{display:flex}
#pn.low{justify-content:flex-end;gap:calc(var(--sw)*.03);padding-bottom:calc(var(--sw)*.06);background:linear-gradient(to bottom,transparent 36%,rgba(255,246,250,.86) 80%);-webkit-backdrop-filter:none;backdrop-filter:none}
#pn.low button:not(.p){background:rgba(255,250,245,.93);color:#3b2a45}
#pn.low p{color:#3b2a45}
#pn h1{margin:0;font-size:calc(var(--sw)*.16);font-style:italic;font-weight:500;line-height:1}
#pn p{margin:0;font-size:calc(var(--sw)*.064);line-height:1.25;max-width:20ch}
#pn p.q{font-size:calc(var(--sw)*.06);max-width:none;font-weight:600;font-style:italic}
button{width:100%;max-width:calc(var(--sw)*.84);padding:calc(var(--sw)*.03) calc(var(--sw)*.05);border-radius:999px;border:1.5px solid var(--rose);background:transparent;color:var(--ink);font:italic 600 calc(var(--sw)*.054)/1.15 "Cormorant Garamond",Georgia,serif;cursor:pointer;-webkit-appearance:none;appearance:none}
button.p{border-color:transparent;color:#fff;background:linear-gradient(135deg,#ea8fb0,#d6648c);box-shadow:0 8px 22px rgba(214,100,140,.4)}
button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
#cap{margin:0;flex:none;width:var(--sw);min-height:calc(var(--fs)*2.5);display:flex;align-items:center;justify-content:center;text-align:center;font-style:italic;font-weight:500;font-size:var(--fs);line-height:1.2;padding:0 2%}
/* ---- cats ---- */
.lg,.arm{transform-box:fill-box;transform-origin:50% 0}
.arm{transition:transform .35s}
.tail{transform-box:fill-box;transform-origin:0 100%;animation:tl 2.2s ease-in-out infinite alternate}
.cat{transition:transform .6s}
.bd{transform-box:fill-box;transform-origin:50% 100%}
.cat[data-t] .bd{animation:tb .46s ease-in-out infinite alternate}
.hd2{transform-origin:0 -44px;transform:rotate(var(--tilt,0deg));transition:transform .5s}
.ey{transform:translateX(var(--lx,0px));transition:transform .4s}
.bl2{transform-box:fill-box;transform-origin:50% 55%;animation:bk 4.6s infinite}
.tz{transform-box:fill-box;transform-origin:50% 0;animation:tf 1.1s ease-in infinite}
.mo,.fw,.bk{display:none}
.n .mn,.a .ma,.h .mh,.s .ms,.l .ml,.c .mc,.w .mw,.t .mt{display:inline}
.kneel .fw{display:inline}
.back .bk{display:inline}
.back .fc,.back .bel,.back .frt,.back .ie{display:none}
.walk .lg.l,.walk .arm.r{animation:sw .4s ease-in-out infinite alternate}
.walk .lg.r,.walk .arm.l{animation:sw .4s ease-in-out infinite alternate-reverse}
.a .arm.l{transform:translateY(20px) rotate(-100deg)}
.a .arm.r{transform:translateY(26px) rotate(100deg)}
.back .arm.l,.back .arm.r{transform:none}
.kneel{transform:translateY(13px)}
.kneel .lg.l{transform:translate(-3px,11px) rotate(90deg)}
.kneel .lg.r{transform:scaleY(.4)}
.kneel .arm.r{transform:rotate(-92deg)}
.hug .arm.l{transform:rotate(96deg)}
.hug .arm.r{transform:rotate(-26deg)}
.hug{transform-box:fill-box;transform-origin:50% 100%;animation:pl 1.6s ease-in-out infinite alternate}
.stage.fin #fg text{opacity:0}
@keyframes tl{from{transform:rotate(-7deg)}to{transform:rotate(9deg)}}
@keyframes sw{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes pl{to{transform:scale(1.04)}}
@keyframes tb{to{transform:translateY(-2.4px) scale(1.012,.99)}}
@keyframes bk{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes tf{0%{transform:translateY(-2px);opacity:0}25%{opacity:.95}100%{transform:translateY(7px);opacity:0}}
@keyframes bob{to{transform:translateY(3px)}}
@keyframes tw{from{transform:translateY(0) scale(.6);opacity:.15}to{transform:translateY(calc(var(--sw)*-.05)) scale(1.1);opacity:.9}}
@keyframes rise{0%{transform:translateY(0) scale(.7);opacity:0}12%{opacity:.95}85%{opacity:.9}100%{transform:translateY(calc(var(--sw)*-1.8)) rotate(var(--r)) scale(1.1);opacity:0}}
@media (prefers-reduced-motion:reduce){.tail,.hug,.bl2,#sp i,#tk{animation:none}#ht svg{animation-duration:12s}}
</style>
</head>
<body>
<main id="app">
<div id="hd"></div>
<div class="stage" id="stage">
<div id="world">
<svg id="bg" viewBox="0 0 360 520">
<defs>
<linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bccbff"/><stop offset=".55" stop-color="#f8dbe8"/><stop offset="1" stop-color="#f8e9d8"/></linearGradient>
<radialGradient id="hg" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#ffb9cf"/><stop offset="1" stop-color="#ea6f98"/></radialGradient>
<radialGradient id="sn"><stop offset="0" stop-color="#fffbe9"/><stop offset=".45" stop-color="#fff3de" stop-opacity=".9"/><stop offset="1" stop-color="#fff3de" stop-opacity="0"/></radialGradient>
<filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
<g id="pw"><ellipse cy="3" rx="4.2" ry="3.6"/><circle cx="-5" cy="-2" r="1.9"/><circle cx="-1.8" cy="-5.2" r="1.9"/><circle cx="1.8" cy="-5.2" r="1.9"/><circle cx="5" cy="-2" r="1.9"/></g>
</defs>
<rect width="360" height="520" fill="url(#sk)"/>
<circle cx="292" cy="62" r="62" fill="url(#sn)"/>
<circle cx="292" cy="62" r="28" fill="#fff8ee" opacity=".92"/>
<path d="M0 300Q90 262 180 300T360 292V520H0Z" fill="#f3d5dd" opacity=".65"/>
<path d="M0 410Q120 370 220 412T360 400V520H0Z" fill="#efc9d5" opacity=".65"/>
<g id="gd"></g>
<path id="tr" fill="none" stroke="#fffaf1" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
<g id="pp" fill="#e0809f"></g>
<g id="ob"></g>
<path id="hh2" fill="#ff8fb4" opacity=".6" filter="url(#gl)"/>
<path id="hh" fill="url(#hg)" stroke="#fff6ec" stroke-width="3" stroke-linejoin="round"/>
<path id="wk" fill="none" stroke="none"/>
</svg>
<canvas id="cv"></canvas>
<svg id="fg" viewBox="0 0 360 520"></svg>
</div>
<div id="vg"></div><div id="sp"></div><div id="ht"></div><div id="bu"></div>

<div id="pn"></div>
</div>

</main>
<script>
const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg',W=360,H=520,wait=t=>new Promise(r=>setTimeout(r,t));
const HD='M12 21C2 14-1 8 2 4 5 0 10 1 12 5 14 1 19 0 22 4 25 8 22 14 12 21Z';
const bl=(x,y,c,k=1)=>[0,1,2,3,4].map(i=>`<circle cx="${(x+Math.cos(i*1.2566)*6*k).toFixed(1)}" cy="${(y+Math.sin(i*1.2566)*6*k).toFixed(1)}" r="${(5.4*k).toFixed(1)}" fill="${c}" stroke="#e7a6bd" stroke-width=".6"/>`).join('')+`<circle cx="${x}" cy="${y}" r="${(3.2*k).toFixed(1)}" fill="#f6c453"/>`;
/* ---------- cat art ---------- */
const LN='fill="none" stroke="#2a2033" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"';
const mir=s=>`<g transform="scale(-1 1)">${s}</g>`;
const eyes=(i,lash,k=1)=>{const one=s=>`<g transform="translate(${s*11.5} -63) scale(${k})"><ellipse rx="5.6" ry="6.6" fill="#2b2136"/><ellipse cy="2.4" rx="4" ry="3.9" fill="url(#y${i})" opacity=".9"/><circle cx="-1.8" cy="-2.8" r="2.3" fill="#fff"/><circle cx="1.9" cy="2.5" r="1.1" fill="#fff" opacity=".9"/>${lash?`<path d="M${s*5} -4.2L${s*8} -7M${s*5.4} -1.2L${s*8.6} -2.4" ${LN} stroke-width="1.3"/>`:''}</g>`;return`<g class="ey"><g class="bl2">${one(-1)}${one(1)}</g></g>`};
const heartEye=x=>`<g transform="translate(${x} -63) scale(.52) translate(-12 -11)"><path d="${HD}" fill="#ff4f86"/><circle cx="7" cy="7" r="2.4" fill="#fff" opacity=".9"/></g>`;
const SMILE=`<path d="M-4.8 -54.6Q0 -47.4 4.8 -54.6Z" fill="#cf4a72" ${LN} stroke-width="1.2"/><ellipse cy="-51.4" rx="2.3" ry="1.3" fill="#ff9db8"/>`;
const pearls=()=>{let s='';for(let k=0;k<=6;k++){const t=k/6,u=1-t,x=u*u*-14+2*u*t*0+t*t*14,y=u*u*-45+2*u*t*-28+t*t*-45;s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2" fill="#fffaf2" stroke="#e3cfd8" stroke-width=".5"/>`}return s+`<g transform="translate(0 -33.4) scale(.4) translate(-12 -11)"><path d="${HD}" fill="#d6648c" stroke="#fff" stroke-width="2"/></g>`};
const cat=P=>{const{i,f,f2,d,l,e}=P,hair=`<path d="M-26.5 -78Q-32 -101 -23.5 -109Q-13 -104 -5 -89Z" fill="${f}"/><path class="ie" d="M-24 -86Q-26.5 -98 -22.8 -103.5Q-16 -99.5 -11.5 -89.5Z" fill="${e}"/>`;
const tuft=`<path d="M-26 -70Q-37.5 -67 -35.5 -58.5Q-31.5 -60.5 -29.5 -56.5Q-26 -60 -25 -62Z" fill="${f}"/><path d="M-27 -58Q-35.5 -52.5 -32 -47.5Q-29.5 -50 -26.5 -48Z" fill="${f}"/>`;
const wh=`<path d="M-23 -58L-36 -61M-23 -54.5L-37 -54.5M-23 -51L-35 -48"/>`;
return`<defs><radialGradient id="h${i}" cx=".42" cy=".3" r=".85"><stop offset="0" stop-color="${f2}"/><stop offset=".78" stop-color="${f}"/><stop offset="1" stop-color="${d}"/></radialGradient>
<radialGradient id="b${i}" cx=".4" cy=".25" r=".95"><stop offset="0" stop-color="${f2}"/><stop offset="1" stop-color="${f}"/></radialGradient>
<radialGradient id="c${i}"><stop offset="0" stop-color="#ff6f9d" stop-opacity=".6"/><stop offset="1" stop-color="#ff6f9d" stop-opacity="0"/></radialGradient>
<radialGradient id="y${i}" cx=".5" cy=".3" r=".85"><stop offset="0" stop-color="${P.eye[0]}"/><stop offset="1" stop-color="${P.eye[1]}"/></radialGradient></defs>
<g class="bd"><ellipse rx="31" ry="5.5" fill="#3a2848" opacity=".17"/>
<g class="tail"><path d="M12 -20C40 -14 49 -50 35 -62" fill="none" stroke="${f}" stroke-width="9" stroke-linecap="round"/><path d="M12 -20C40 -14 49 -50 35 -62" fill="none" stroke="${d}" stroke-width="2" stroke-linecap="round" opacity=".25" transform="translate(1.5 1.5)"/><circle cx="35" cy="-62" r="5.6" fill="${l}"/></g>
<g class="lg l"><rect x="-17" y="-20" width="13" height="19" rx="6" fill="${d}"/><ellipse cx="-10.5" cy="-3.6" rx="8.8" ry="5" fill="${l}"/><path d="M-13.5 -2.4V-5.4M-10.5 -1.8V-5.2M-7.5 -2.4V-5.4" stroke="${d}" stroke-width=".9" stroke-linecap="round" opacity=".55"/></g>
<g class="lg r"><rect x="4" y="-20" width="13" height="19" rx="6" fill="${d}"/><ellipse cx="10.5" cy="-3.6" rx="8.8" ry="5" fill="${l}"/><path d="M7.5 -2.4V-5.4M10.5 -1.8V-5.2M13.5 -2.4V-5.4" stroke="${d}" stroke-width=".9" stroke-linecap="round" opacity=".55"/></g>
<path d="M-18 -50C-27 -38 -25 -15 -14 -9H14C25 -15 27 -38 18 -50Z" fill="url(#b${i})"/>
<ellipse class="bel" cx="0" cy="-27" rx="12.5" ry="15.5" fill="${l}"/>
<g class="arm l"><rect x="-27" y="-52" width="11" height="26" rx="5.5" fill="${d}"/><ellipse cx="-21.5" cy="-27.5" rx="6.4" ry="5.6" fill="${l}"/></g>
<g class="arm r"><rect x="16" y="-52" width="11" height="26" rx="5.5" fill="${d}"/><ellipse cx="21.5" cy="-27.5" rx="6.4" ry="5.6" fill="${l}"/></g>
<g class="hd2">${hair}${mir(hair)}${tuft}${mir(tuft)}
<ellipse cy="-66" rx="29" ry="25" fill="url(#h${i})"/><ellipse cx="-8" cy="-81" rx="11" ry="4.2" fill="#fff" opacity=".16" transform="rotate(-12 -8 -81)"/>
${P.top||''}
<g class="bk"><path d="M-8 -80Q0 -87 8 -80M-5 -74.5Q0 -79 5 -74.5" fill="none" stroke="${d}" stroke-width="1.6" stroke-linecap="round" opacity=".4"/></g>
<g class="fc"><ellipse cy="-53.5" rx="10" ry="7" fill="${l}" opacity=".95"/><ellipse cx="-19" cy="-54" rx="6.5" ry="4" fill="url(#c${i})"/><ellipse cx="19" cy="-54" rx="6.5" ry="4" fill="url(#c${i})"/>
<path d="M-2.5 -58.6Q0 -60 2.5 -58.6Q1.3 -56 0 -55.4Q-1.3 -56 -2.5 -58.6Z" fill="#e8799b"/>
<g stroke="${d}" stroke-width=".9" fill="none" stroke-linecap="round" opacity=".6">${wh}${mir(wh)}</g>
<g class="mo mn">${eyes(i,P.lash)}<path d="M0 -55.4V-54.2M-3.8 -54Q-1.8 -52 0 -54.2Q1.8 -52 3.8 -54" ${LN} stroke-width="1.3"/></g>
<g class="mo ma">${eyes(i,P.lash,.9)}<path d="M-17.5 -74L-6.5 -70M17.5 -74L6.5 -70" ${LN} stroke-width="2.2"/><path d="M-3.6 -52.6Q0 -56 3.6 -52.6" ${LN} stroke-width="1.4"/><ellipse cx="-20" cy="-53" rx="7.5" ry="5" fill="#ff7fa6" opacity=".35"/><ellipse cx="20" cy="-53" rx="7.5" ry="5" fill="#ff7fa6" opacity=".35"/></g>
<g class="mo mh"><path d="M-16.5 -61.5Q-11.5 -68.5 -6.5 -61.5M6.5 -61.5Q11.5 -68.5 16.5 -61.5" ${LN} stroke-width="2.1"/>${SMILE}</g>
<g class="mo ms">${eyes(i,P.lash)}<path d="M-17 -71.5L-7 -74.5M17 -71.5L7 -74.5" ${LN} stroke-width="1.6" opacity=".8"/><path d="M-3.5 -52.6Q-1.8 -55.4 0 -53.6Q1.8 -55.4 3.5 -52.6" ${LN} stroke-width="1.4"/><path d="M-17 -57Q-20 -52 -17 -49.5Q-14 -52 -17 -57Z" fill="#bfe0ff" stroke="#8cbdf0" stroke-width=".5"/></g>
<g class="mo ml">${heartEye(-11.5)}${heartEye(11.5)}${SMILE}</g>
<g class="mo mc"><path d="M-16.5 -64Q-11.5 -58 -6.5 -64M6.5 -64Q11.5 -58 16.5 -64" ${LN} stroke-width="2"/><path class="tz" d="M-13.5 -60Q-17 -51 -13.5 -45Q-10 -51 -13.5 -60Z" fill="#b9dcff" opacity=".9"/><path class="tz" style="animation-delay:.5s" d="M13.5 -60Q10 -51 13.5 -45Q17 -51 13.5 -60Z" fill="#b9dcff" opacity=".9"/><path d="M-4 -52.6Q0 -58 4 -52.6Q0 -50.2 -4 -52.6Z" fill="#c9456d" ${LN} stroke-width="1"/></g>
<g class="mo mw">${eyes(i,P.lash,1.12)}<path d="M-17 -73Q-12 -77.5 -7 -74M17 -73Q12 -77.5 7 -74" ${LN} stroke-width="1.6" opacity=".8"/><ellipse cy="-52.8" rx="2.1" ry="2.7" fill="#c9456d"/></g>
<g class="mo mt">${eyes(i,P.lash)}<ellipse cx="-11.5" cy="-57.4" rx="5" ry="1.5" fill="#d6ecff" opacity=".9"/><ellipse cx="11.5" cy="-57.4" rx="5" ry="1.5" fill="#d6ecff" opacity=".9"/><path d="M-17 -58Q-19.5 -53.5 -17 -51Q-14.5 -53.5 -17 -58Z" fill="#bfe0ff" stroke="#8cbdf0" stroke-width=".5"/><path d="M-4.2 -54Q0 -49.6 4.2 -54" ${LN} stroke-width="1.5"/></g></g>
${P.acc||''}</g>
<g class="frt">${P.frt||''}</g>
